<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Çinili Saray{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { min-height: 100vh; background: #070b14; color: white; }
        a { color: inherit; text-decoration: none; }
        .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
        .sidebar { padding: 28px 20px; border-right: 1px solid rgba(255,255,255,.08); background: #0b101b; }
        .brand { font-weight: 800; letter-spacing: .08em; margin-bottom: 40px; }
        .menu a { display: block; padding: 13px 14px; margin-bottom: 8px; border-radius: 12px; color: #8f9ab0; }
        .menu a.active, .menu a:hover { color: white; background: rgba(255,255,255,.07); }
        .main { padding: 32px; }
        .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 28px; }
        .topbar h1 { font-size: 28px; margin-top: 4px; }
        .topbar small { color: #8d98ad; }
        .welcome-text { margin-top: 8px; color: #8d98ad; font-size: 14px; }
        .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .action-btn { padding: 11px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; display: inline-flex; }
        .action-btn.primary { background: linear-gradient(135deg, #ffffff, #a9c6ff); color: #08101d; }
        .action-btn.secondary { color: white; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
        .card, .panel { padding: 24px; border: 1px solid rgba(255,255,255,.08); border-radius: 18px; background: rgba(255,255,255,.04); }
        .card small { color: #8d98ad; }
        .card strong { display: block; margin-top: 14px; font-size: 30px; }
        .panel h2 { font-size: 18px; margin-bottom: 18px; }
        .messages { list-style: none; margin-bottom: 18px; }
        .messages li { padding: 12px 14px; border-radius: 12px; margin-bottom: 8px; font-size: 14px; }
        .messages .success { background: rgba(80,200,160,.12); border: 1px solid rgba(80,200,160,.25); color: #9be7cb; }
        .messages .error { background: rgba(255,100,100,.1); border: 1px solid rgba(255,100,100,.25); color: #ffb0b0; }
        .messages .warning { background: rgba(255,190,80,.1); border: 1px solid rgba(255,190,80,.25); color: #ffd89a; }
        .form-grid { display: grid; gap: 16px; max-width: 520px; }
        label { display: block; font-size: 12px; color: #8d98ad; margin-bottom: 8px; letter-spacing: .04em; }
        input[type=text], input[type=date], input[type=file] {
            width: 100%; height: 48px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1);
            background: #111827; color: white; padding: 0 14px; font-size: 14px;
        }
        input[type=file] { padding-top: 12px; height: auto; min-height: 48px; }
        .hint { margin-top: 8px; color: #68748b; font-size: 12px; line-height: 1.5; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,.06); vertical-align: top; }
        th { color: #8d98ad; font-weight: 600; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
        td a { color: #a9c6ff; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,.06); color: #9da8be; font-size: 11px; }
        .empty { color: #8d98ad; font-size: 14px; padding: 12px 0; }
        .talebe-block { margin-bottom: 22px; }
        .talebe-block h3 { font-size: 15px; margin-bottom: 8px; }
        .muted { color: #8d98ad; }
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .stats { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">ÇİNİLİ SARAY</div>
        <div class="menu">
            <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">Ana Panel</a>
            <a href="{% url 'etut_panel' %}" class="{% if request.resolver_match.url_name == 'etut_panel' or request.resolver_match.url_name == 'etut_kontrol' or request.resolver_match.url_name == 'etut_deneme_detay' or request.resolver_match.url_name == 'etut_konu_detay' %}active{% endif %}">Etüt Kontrol</a>
            <a href="{% url 'akademik_takip' %}" class="{% if request.resolver_match.url_name == 'akademik_takip' or request.resolver_match.url_name == 'deneme_yukle' or request.resolver_match.url_name == 'deneme_detay' or request.resolver_match.url_name == 'deneme_sinif_raporu' or request.resolver_match.url_name == 'konu_listesi' %}active{% endif %}">Akademik Yükle</a>
            <a href="{% url 'konu_listesi' %}" class="{% if request.resolver_match.url_name == 'konu_listesi' %}active{% endif %}">Konular</a>
            <a href="{% url 'etut_panel' %}">Talebeler</a>
            <a href="#">Sınavlar</a>
            <a href="#">Yoklamalar</a>
            <a href="#">Raporlar</a>
        </div>
    </aside>
    <main class="main">
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
