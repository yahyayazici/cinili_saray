<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş | Çinili Saray</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
            radial-gradient(circle at top left,#1b4cff33,transparent 35%),
            radial-gradient(circle at bottom right,#00ffc333,transparent 35%),
            #070b14;
            color:white;
        }

        .card{
            width:420px;
            background:rgba(255,255,255,.05);
            backdrop-filter:blur(25px);
            border:1px solid rgba(255,255,255,.08);
            border-radius:24px;
            padding:40px;
        }

        h1{
            font-size:34px;
            margin-bottom:10px;
        }

        p{
            color:#9ba7c2;
            margin-bottom:35px;
        }

        input{
            width:100%;
            height:55px;
            border:none;
            outline:none;
            border-radius:14px;
            background:#111827;
            color:white;
            padding:0 18px;
            margin-bottom:18px;
            font-size:15px;
        }

        button{
            width:100%;
            height:55px;
            border:none;
            border-radius:14px;
            background:linear-gradient(135deg,#ffffff,#9ec5ff);
            color:#08101d;
            font-weight:700;
            cursor:pointer;
            font-size:16px;
        }

        .logo{
            font-size:13px;
            letter-spacing:3px;
            color:#8ea4d8;
            margin-bottom:20px;
        }
        .error-message {
    margin: 12px 0 0;
    color: #ff8f8f;
    font-size: 13px;
}
    </style>
</head>
<body>

<div class="card">

    <div class="logo">
        ÇİNİLİ SARAY
    </div>

    <h1>Hoş Geldiniz</h1>

    <p>Eğitim Yönetim Sistemine giriş yapın.</p>

  <form method="post">
    {% csrf_token %}

    <input
        type="text"
        name="username"
        placeholder="Kullanıcı Adı"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Şifre"
        required
    >

    {% if error_message %}
        <p class="error-message">{{ error_message }}</p>
    {% endif %}

    <button type="submit">Giriş Yap</button>
</form>

</div>

</body>
</html>
